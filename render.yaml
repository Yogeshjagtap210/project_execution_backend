services:
  # -------------------------------------------------------------
  # Fullstack Service (Express Backend + React Frontend)
  # Serves both website UI and API endpoints on a single URL!
  # -------------------------------------------------------------
  - type: web
    name: project-execution-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
